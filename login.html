<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login | Capricorn Registration Portal</title><link rel="stylesheet" href="CSS/style.css"></head><body>
<div id="drawerOverlay" class="sidebar-overlay"></div><aside id="sideDrawer" class="side-drawer"><div class="drawer-top"><button class="drawer-close" data-close-drawer aria-label="Close menu">×</button><div class="drawer-user"><img data-student-photo src="IMAGES/logo.png" alt="No profile available"><div class="drawer-name" data-student-name>No Profile Available</div></div><a class="logout" href="index.html">LOGIN</a></div><div class="drawer-body"><div class="drawer-title">Menu</div><div class="drawer-section"><a class="drawer-link" href="index.html">HOME</a></div><div class="drawer-section"><a class="drawer-link" href="register.html?fresh=1">REGISTER ACCOUNT</a></div><div class="drawer-section"><a class="drawer-link" href="faq.html">FAQ</a></div></div></aside>
<header class="topbar"><div class="brand"><a href="index.html"><img class="logo" src="IMAGES/logo.png" alt="College logo"></a><span class="version">3.25.6.0</span></div><div class="top-actions"><a href="faq.html">? FAQ</a><button class="menu-btn" data-open-drawer aria-label="Open menu">☰</button></div></header>
<main class="page"><div class="card auth-card"><div class="auth-icon">🔐</div><h1 class="page-title">Student Login</h1><p class="subtitle">Use the ID / passport number and password you created during registration.</p><form id="loginForm"><div class="form-group"><label for="loginId">ID / Passport Number</label><input id="loginId" required autocomplete="username"></div><div class="form-group"><label for="loginPassword">Password</label><input id="loginPassword" type="password" required autocomplete="current-password"></div><button class="btn btn-primary btn-block" type="submit">LOGIN</button></form><div class="auth-divider">or</div><a class="btn btn-block" href="register.html">CREATE A NEW ACCOUNT</a></div></main>
<script src="JS/app.js"></script><script>document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const id=document.getElementById('loginId').value.trim(),pw=document.getElementById('loginPassword').value;const state=getState();if(!state.account.studentNumber){alert('No account exists yet. Please register first.');location.href='register.html';return}if(id===state.account.studentNumber&&pw===state.account.password&&state.student){state.loggedIn=true;saveState(state);location.href='dashboard.html'}else alert('Incorrect ID / passport number or password. Please try again.');});</script></body></html>
